[tasks.build]
description = "Compile ps5-remote"
run = "swift build -c release && cp .build/release/ps5-remote ."

[tasks.run]
description = "Build and run ps5-remote"
depends = ["build"]
run = "./ps5-remote"

[tasks.debug]
description = "Build and run with HID event logging"
depends = ["build"]
run = "./ps5-remote --debug --config bindings.yaml"
