[tasks]

[tasks.build]
description = "Build the PS5 controller utility"
run = "swiftc -o ps5-remote main.swift Controller.swift Actions.swift Mapping.swift -framework IOKit -framework CoreGraphics -framework AppKit"

[tasks.run]
description = "Run the PS5 controller utility"
run = "./ps5-remote"
depends = ["build"]

[tasks.clean]
description = "Remove built artifacts"
run = "rm -f ps5-remote *.o *.swiftmodule"

[tasks.rebuild]
description = "Clean and build"
run = "mise run clean && mise run build"

[tasks.stop]
description = "Stop running process"
run = "killall ps5-remote 2>/dev/null || true"

[tasks.watch]
description = "Watch files and rebuild/rerun on changes"
run = "mise run stop && mise run build && mise run run"
watch = ["*.swift"]
